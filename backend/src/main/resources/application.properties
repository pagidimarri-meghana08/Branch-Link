# ===================================================================
# BranchLink Core Server Configuration
# ===================================================================
server.port=${PORT:8080}
server.error.include-message=always

# Database Configuration (Defaults to embedded H2 if DB_URL is not provided; switchable to MySQL/TiDB via DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/branchlink;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging Level
logging.level.org.springframework.web=INFO
logging.level.com.branchlink=INFO

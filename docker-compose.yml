version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: branchlink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: branchlink
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: branchlink-backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://mysql:3306/branchlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USER: root
      DB_PASS: ${DB_PASS:-root}
      JWT_SECRET: ${JWT_SECRET:-branchlink-demo-secret-key-change-me-0123456789}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: branchlink-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
